<body></body>
<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js"></script>
<script>

  nn.get('body')
    .css('background', 'pink')
    .css('margin', 0)

  const sounds = [
    nn.create('audio').set('src', 'SOUND1.mp3').set('preload', 'auto').addTo('body'),
    nn.create('audio').set('src', 'SOUND2.mp3').set('preload', 'auto').addTo('body'),
    nn.create('audio').set('src', 'SOUND3.mp3').set('preload', 'auto').addTo('body'),
    nn.create('audio').set('src', 'SOUND4.mp3').set('preload', 'auto').addTo('body'),
    nn.create('audio').set('src', 'SOUND5.mp3').set('preload', 'auto').addTo('body')
  ]

  const svg = nn.create('svg').addTo('body')

  function drop () {
    const clr = nn.randomColor()
    const x = nn.random(nn.width)
    const y = nn.random(nn.height)
    const r = nn.random(10, 100)
    const circ = svg.circle(x, y, r).fill(clr)

    const timing = {
      duration: 600,
      easing: 'ease-out'
    }
    const keyframes = [
      { r: 0, opacity: 0 },
      { r: r, opacity: 1 },
      { r: r, opacity: 0 }
    ]
    const anim = circ.animate(keyframes, timing)
    anim.onfinish = () => circ.remove()
  }

  function play () {
    const i = Math.floor(nn.random(sounds.length))
    const sound = sounds[i]

    sound.currentTime = 0
    sound.play()
    drop()
  }

  nn.on('keydown', play)

</script>
